<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berean Standard Bible Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="search-container">
      <input type="text" id="quick-search" placeholder="Search: Gen 1:3 or John 3" />
      <button id="search-btn">Go</button>
    </div>

    <div class="selectors-container">
      <select id="book-select" aria-label="Select Book"></select>
      <select id="chapter-select" aria-label="Select Chapter"></select>
    </div>
  </header>

  <nav class="nav-bar">
    <button id="btn-prev-book" title="Previous Book">&laquo; Prev Book</button>
    <button id="btn-prev-chapter" title="Previous Chapter">&lsaquo; Prev Chapter</button>
    <span id="current-reference">Loading...</span>
    <button id="btn-next-chapter" title="Next Chapter">Next Chapter &rsaquo;</button>
    <button id="btn-next-book" title="Next Book">Next Book &raquo;</button>
  </nav>

  <main id="reader-container">
    <div id="chapter-content" class="chapter-content"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
